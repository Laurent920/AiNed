# ============================================================================
# FPTT + MinimalRNN Configuration
# ============================================================================
# Uses MinimalRNN cell with Forward Propagation Through Time (FPTT)
# Run with: taskset -c 0-6 env JAX_PLATFORMS=cpu mpirun -n 3 python async_RNN_fptt_mpi.py --config configs/RNN_fptt_config.yaml

# ============================================================================
# NETWORK ARCHITECTURE
# ============================================================================
dataset: smnist
layer_sizes: [1, 128, 10]
# layer_sizes: [1, 256, 10]


dataset: shd
layer_sizes: [700, 256, 20]

dataset: mnist
# layer_sizes: [784, 256, 256, 10]
layer_sizes: [784, 256, 10]

recurrence: [null, null, null]
mode: training
use_bias: false
use_tanh: false

# ============================================================================
# CELL TYPE
# ============================================================================
cell_type: minimalrnn    # "aed" (default AED rule) or "minimalrnn"

# ============================================================================
# FPTT PARAMETERS
# ============================================================================
fptt_parts: 10           # P: number of chunks (1 = no FPTT, standard BPTT)
fptt_alpha: 0.1          # Consensus regularizer alpha
fptt_beta: 0.5           # Consensus running average decay for shadow params
fptt_lambda: 2.0         # Consensus quadratic penalty scale
fptt_rho: 0.0            # Consensus lm*param coefficient
fptt_clip: 1.0           # Gradient clipping max norm
fptt_warm_epochs: 1      # Epochs using uniform oracle before learned oracle
fptt_accumulate_logits: true  # Accumulate logits across chunks (AED-specific improvement)
fptt_avg_logits: false         # Average accumulated logits by chunk count (prevents magnitude growth)

# ============================================================================
# TRAINING PARAMETERS
# ============================================================================
batch_size: 36
num_epochs: 50
learning_rate: 0.0001
optimizer: adam

load_file: false
best: false
rerun: null
override_params: null

# ============================================================================
# NEURON BEHAVIOR (for event-driven output of hidden MinimalRNN layers)
# ============================================================================
restrict: null
init_thresholds: 0.0
shuffle_activations: false
shuffle_input: false
firing_nb: 10000         # High value = no sparsity constraint on MinimalRNN output
sync_rate: 1
top_weights: -1

# ============================================================================
# LEARNING AND REGULARIZATION
# ============================================================================
threshold_lr: 0.0
sparsity_impact: [0.0, 0.0, 0.0]
w_reg: 0.0
history_size: 0
